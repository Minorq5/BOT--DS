services:
  bot:
    build: .
    container_name: veritas-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/veritas.db
      # Внутри контейнера API слушает все интерфейсы, но порт ниже опубликован
      # только на 127.0.0.1 хоста — наружу его выставляет ваш nginx/Caddy.
      API_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
